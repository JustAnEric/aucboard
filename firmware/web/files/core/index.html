<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aucboard | Panel</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <div class="header">aucboard / web home</div>
    <div class="dashboard-grid">
        <div class="card">
            <div class="card-header">
                <span class="icon">⚡</span>
                <span class="entity-name">cpu</span>
            </div>
            <div class="entity-state">0.0% / N/A°C / N/A°F</div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="icon">💾</span>
                <span class="entity-name">ram</span>
            </div>
            <div class="entity-state">0.0 / 512 MB</div>
        </div>

        <div class="card media-card">
            <div>
                <span class="entity-name">now playing</span>
                <div class="entity-state">N/A</div>
            </div>
            <div class="controls">
                <span class="btn-icon">⏮</span>
                <span class="btn-icon">⏯</span>
                <span class="btn-icon">⏭</span>
            </div>
        </div>


    </div>

    <script type="module" src="/static/js/dashboard.index.js"></script>
</body>
</html>
